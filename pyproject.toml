[project]
name = "hai-attack-reader"
version = "0.1.0"
description = "Labelled control-loop windows from the four versions of the HAI dataset"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8"]
# only for tests/test_training.py::test_dataset_*; training itself runs in OpenTSLM's own environment
training = ["torch>=2.2", "tqdm>=4.62"]

[project.scripts]
hai-build = "hai.build:main"
hai-export = "hai.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
