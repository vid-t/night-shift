# Publishes the demo page to GitHub Pages. Started by hand only:
#   gh workflow run pages.yml
# Before the first run, turn Pages on for the repository with "GitHub Actions" as the source.
# Only the five entries of the publish list in demo/README.md go out.
name: Publish the demo page

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the publish list
        run: |
          mkdir site
          cp -R demo/index.html demo/css demo/js demo/fonts demo/data site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
